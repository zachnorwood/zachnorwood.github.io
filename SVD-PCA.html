<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SVD Dimensionality Reduction Demo</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
  <div id="plot"></div>
  <script>
    // Generate synthetic data along y = 1.5x with noise
    function generateData(n=200) {
      let x = [];
      let y = [];
      for (let i=0; i<n; i++) {
        let xi = (Math.random()*2-1)*3; // random between -3 and 3
        let yi = 1.5*xi + 0.2*(Math.random()*2-1);
        x.push(xi);
        y.push(yi);
      }
      return {x:x, y:y};
    }

    const data = generateData();

    // Projection function
    function projectPoints(theta, points) {
      let dir = [Math.cos(theta), Math.sin(theta)];
      let projections = points.x.map((xi, i) => xi*dir[0] + points.y[i]*dir[1]);
      return {dir:dir, proj:projections};
    }

    // Initial angle
    let theta0 = Math.atan(1.5);
    let proj0 = projectPoints(theta0, data);

    // Line through origin
    let lineX = [-3, 3];
    let lineY = lineX.map(xi => (proj0.dir[1]/proj0.dir[0])*xi);

    // Initial traces
    let traces = [
      {x:data.x, y:data.y, mode:'markers', type:'scatter', name:'Data'},
      {x:lineX, y:lineY, mode:'lines', type:'scatter', name:'Line'},
      {x:proj0.proj, y:Array(proj0.proj.length).fill(0), mode:'markers', type:'scatter', name:'Projection'}
    ];

    // Build slider steps
    let steps = [];
    for (let i=0; i<30; i++) {
      let theta = i*Math.PI/29;
      let proj = projectPoints(theta, data);
      let lineY = lineX.map(xi => (proj.dir[1]/proj.dir[0])*xi);

      steps.push({
        method:'update',
        args:[{
          x:[data.x, lineX, proj.proj],
          y:[data.y, lineY, Array(proj.proj.length).fill(0)]
        }],
        label:(theta*180/Math.PI).toFixed(0)+'°'
      });
    }

    let layout = {
      grid:{rows:2, columns:1, pattern:'independent'},
      height:2000,
      title:'SVD Dimensionality Reduction Demo',
      sliders:[{
        active:0,
        currentvalue:{prefix:'Angle: '},
        x: 0.5, 
        xanchor: 'center',  
        y: 0.55, 
        yanchor: 'top',       // just above the bottom subplot  pad: {t: 0, b: 4, l: 0, r: 0},  
        steps: steps
      }],
      // Fix axis ranges so they don't rescale dynamically
      xaxis: {range: [-6, 6],  constrain: 'domain'},
      yaxis: {range: [-6, 6], scaleanchor: 'x'}, // lock aspect ratio
      xaxis2: {range: [-4, 4], },
      yaxis2: {range: [-1, 1]}
    };

    Plotly.newPlot('plot', traces, layout, {responsive: true});
  </script>
</body>
</html>
